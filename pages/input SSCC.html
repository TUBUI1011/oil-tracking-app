<!DOCTYPE html>
<html class="light" lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Quản lý Tank Dầu</title>
    <!-- Xóa Tailwind, thêm CSS mới -->
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/assets/styles/inputsscc.css" />
    <style>
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      }
    </style>
  </head>
  <body class="sscc-page">
    <div class="page-container">
      <header class="sscc-header">
        <button class="header-button">
          <span class="material-symbols-outlined">arrow_back_ios_new</span>
        </button>
        <h1 class="header-title">Quản lý Tank Dầu</h1>
        <div class="header-placeholder"></div>
      </header>

      <main class="sscc-main">
        <div class="form-wrapper">
          <div class="form-group">
            <p class="form-label">Material Code</p>
            <div class="input-wrapper">
              <input
                class="form-input"
                placeholder="Nhập mã material"
                value=""
              />
            </div>
          </div>

          <div class="form-group">
            <p class="form-label">SSCC</p>
            <div class="input-wrapper">
              <input
                class="form-input"
                placeholder="Nhập mã SSCC"
                value=""
                style="padding-right: 3.5rem"
              />
              <button class="input-icon-button">
                <span class="material-symbols-outlined">qr_code_scanner</span>
              </button>
            </div>
          </div>

          <div class="form-group">
            <p class="form-label">Dung tích tank (lít)</p>
            <div class="input-wrapper">
              <input
                class="form-input"
                placeholder="Ví dụ: 1000"
                type="number"
                value=""
              />
            </div>
          </div>

          <div class="form-group">
            <p class="form-label">Trạng thái</p>
            <div class="input-wrapper">
              <select class="form-select">
                <option>Đang sử dụng</option>
                <option>Trống</option>
                <option>Đang bơm</option>
                <option>Bảo trì</option>
              </select>
              <div class="select-arrow-icon">
                <span class="material-symbols-outlined">expand_more</span>
              </div>
            </div>
          </div>

          <div class="divider-container">
            <div class="divider-line"></div>
            <span class="divider-text">hoặc</span>
            <div class="divider-line"></div>
          </div>

          <button class="upload-button">
            <span class="material-symbols-outlined">upload_file</span>
            Tải lên dữ liệu
          </button>
        </div>
      </main>

      <footer class="sscc-footer">
        <button class="save-button">Lưu thông tin</button>
      </footer>
    </div>
  </body>
</html>
